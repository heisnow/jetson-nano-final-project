<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ project.name }}{% endblock %}</title>
    <style>
      :root {
        --bg: #f4f7f1;
        --paper: #ffffff;
        --ink: #1d241f;
        --muted: #5f6a62;
        --line: #dce4d7;
        --green: #246b55;
        --green-dark: #174b3a;
        --green-soft: #dcefe6;
        --blue: #2f6287;
        --amber: #bd7a19;
        --amber-soft: #f7e6c6;
        --danger: #a74835;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .nav {
        width: min(1120px, calc(100% - 32px));
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        color: var(--green);
        font-size: 1.05rem;
        font-weight: 900;
        text-decoration: none;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .links a {
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--muted);
        text-decoration: none;
        font-weight: 800;
      }

      .links a:hover {
        background: var(--green-soft);
        color: var(--green-dark);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 52px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
        gap: 18px;
        align-items: stretch;
      }

      .panel,
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .panel {
        padding: 24px;
      }

      .card {
        padding: 18px;
      }

      .tag {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-dark);
        font-weight: 900;
        font-size: 0.92rem;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 16px;
        font-size: clamp(2rem, 4vw, 3.6rem);
        line-height: 1.12;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 14px;
        font-size: 1.3rem;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 1.05rem;
      }

      p,
      li {
        color: var(--muted);
        line-height: 1.75;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 9px 14px;
        border: 1px solid var(--green);
        border-radius: 8px;
        background: var(--green);
        color: white;
        text-decoration: none;
        font-weight: 900;
        cursor: pointer;
      }

      .button.secondary {
        background: transparent;
        color: var(--green);
      }

      .button.warning {
        border-color: var(--amber);
        background: var(--amber);
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .badge,
      .meta span {
        display: inline-flex;
        padding: 6px 9px;
        border-radius: 999px;
        background: #eef2ea;
        color: var(--green-dark);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .stat {
        display: grid;
        gap: 4px;
      }

      .stat strong {
        color: var(--green);
        font-size: 2.1rem;
      }

      .rule-list {
        display: grid;
        gap: 12px;
      }

      .rule {
        display: grid;
        gap: 8px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(160px, 240px) auto;
        gap: 10px;
        margin-top: 16px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        background: var(--paper);
        color: var(--ink);
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .bar-row {
        display: grid;
        grid-template-columns: minmax(120px, 180px) 1fr 48px;
        gap: 10px;
        align-items: center;
        margin: 11px 0;
      }

      .bar-track {
        min-height: 14px;
        border-radius: 999px;
        background: #e7ece2;
        overflow: hidden;
      }

      .bar-fill {
        min-height: 14px;
        border-radius: 999px;
        background: var(--green);
      }

      .camera-frame {
        position: relative;
        overflow: hidden;
        min-height: 360px;
        border-radius: 8px;
        background: #111;
      }

      video,
      canvas {
        width: 100%;
        height: 100%;
        min-height: 360px;
        object-fit: cover;
        display: block;
      }

      .camera-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #dfe8dc;
        text-align: center;
      }

      .result-box {
        border-left: 4px solid var(--green);
        background: #f8fbf7;
      }

      .result-box.low {
        border-left-color: var(--danger);
      }

      footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 36px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .nav,
        .hero,
        .grid,
        .grid.two,
        .filter,
        .bar-row {
          grid-template-columns: 1fr;
        }

        .nav {
          align-items: flex-start;
          padding: 14px 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="主選單">
        <a class="brand" href="{{ url_for('index') }}">{{ project.short_name }}</a>
        <div class="links">
          <a href="{{ url_for('index') }}">首頁</a>
          <a href="{{ url_for('scan') }}">鏡頭掃描</a>
          <a href="{{ url_for('rules') }}">回收資料庫</a>
          <a href="{{ url_for('analysis') }}">資料分析</a>
          <a href="{{ url_for('plan') }}">專題計畫</a>
        </div>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      {{ project.name }} / Flask + Browser Camera + PostgreSQL + Crawler + Render
    </footer>
  </body>
</html>
