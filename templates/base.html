<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ project.name }}{% endblock %}</title>
    <style>
      :root {
        --bg: #f5f6f1;
        --paper: #ffffff;
        --ink: #1e241f;
        --muted: #5f675f;
        --line: #dde2d7;
        --green: #236b5c;
        --green-soft: #dcebe5;
        --amber: #c47d1c;
        --amber-soft: #f7e7c9;
        --blue: #315f8f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 64px;
      }

      .brand {
        font-weight: 900;
        color: var(--green);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .links a {
        padding: 8px 10px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--muted);
        font-weight: 700;
      }

      .links a:hover {
        background: var(--green-soft);
        color: var(--green);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 52px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
        gap: 20px;
        align-items: stretch;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 24px;
      }

      .tag {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 800;
        font-size: 0.92rem;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 16px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1.12;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 14px;
        font-size: 1.25rem;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 1.05rem;
      }

      p,
      li {
        color: var(--muted);
        line-height: 1.75;
      }

      ul {
        margin: 0;
        padding-left: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat {
        display: grid;
        gap: 6px;
      }

      .stat strong {
        font-size: 2.2rem;
        color: var(--green);
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .badge {
        display: inline-flex;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f9faf7;
        color: var(--green);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .article-list {
        display: grid;
        gap: 12px;
      }

      .article {
        display: grid;
        gap: 8px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .meta span {
        padding: 4px 8px;
        border-radius: 999px;
        background: #f0f2ec;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 9px 14px;
        border: 1px solid var(--green);
        border-radius: 8px;
        background: var(--green);
        color: white;
        text-decoration: none;
        font-weight: 800;
      }

      .button.secondary {
        background: transparent;
        color: var(--green);
      }

      .filter {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(160px, 220px) auto;
        gap: 10px;
        margin-bottom: 16px;
      }

      input,
      select {
        min-height: 42px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        font: inherit;
        background: var(--paper);
      }

      .bar-row {
        display: grid;
        grid-template-columns: minmax(120px, 180px) 1fr 48px;
        gap: 10px;
        align-items: center;
        margin: 11px 0;
      }

      .bar-track {
        min-height: 14px;
        border-radius: 999px;
        background: #e9ece4;
        overflow: hidden;
      }

      .bar-fill {
        min-height: 14px;
        border-radius: 999px;
        background: var(--amber);
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .event {
        padding: 14px;
        border-left: 4px solid var(--amber);
        background: #fffaf1;
      }

      footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 36px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }

      @media (max-width: 820px) {
        .nav,
        .hero,
        .grid,
        .grid.two,
        .filter {
          grid-template-columns: 1fr;
        }

        .nav {
          align-items: flex-start;
          padding: 14px 0;
        }

        .bar-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="主選單">
        <div class="brand">Safety Insight</div>
        <div class="links">
          <a href="{{ url_for('index') }}">首頁</a>
          <a href="{{ url_for('articles') }}">資料庫</a>
          <a href="{{ url_for('analysis') }}">資料分析</a>
          <a href="{{ url_for('jetson') }}">Jetson 擴充</a>
          <a href="{{ url_for('plan') }}">專題計畫</a>
        </div>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      {{ project.name }} / Flask + PostgreSQL + crawler + Render
    </footer>
  </body>
</html>
