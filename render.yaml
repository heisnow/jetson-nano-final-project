services:
  - type: web
    name: ecolens-flask
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ecolens-postgres
          property: connectionString

databases:
  - name: ecolens-postgres
